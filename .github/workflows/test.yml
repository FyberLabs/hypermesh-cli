name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Binaries exist
        run: test -x bin/hypermesh && test -x bin/hm && ./bin/hypermesh --help >/dev/null
